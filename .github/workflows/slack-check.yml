name: slack-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explicit:
    uses: AceMQ-Company/acemq-java-amqp/.github/workflows/slack-notify.yml@main
    with:
      status: success
      title: "Slack wiring verified"
      message: "Sent from acemq-java-rabbitmq-admin to confirm the webhook reaches the channel."
      icon: ":satellite_antenna:"
    secrets:
      SLACK_DELIVERY_WEBHOOK: ${{ secrets.SLACK_DELIVERY_WEBHOOK }}
