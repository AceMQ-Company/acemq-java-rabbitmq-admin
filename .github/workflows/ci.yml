# Build and test on every JDK this library promises to run on.
#
# `verify` rather than `test`, because the unit tests here prove very little on
# their own: this library's whole job is to talk to RabbitMQ's management API,
# and the behaviours that have actually bitten -- the default vhost needing to
# arrive as %2F, URLEncoder turning a space into a plus, RabbitMQ 4 recording
# x-queue-type on every queue, and HTTP/2's h2c upgrade breaking every request
# with a body -- are all invisible without a broker. ubuntu-latest has Docker.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the minimum toolchain, 21 and 25 are what estates actually run.
        # Published bytecode is Java 11 regardless, so that an application on
        # Boot 2.7 can use this library and acemq-java-amqp together.
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress clean verify

      - name: Verify published bytecode targets Java 11
        if: matrix.java == '17'
        # The promise is that a Boot 2.7 application on Java 11 can use this. A
        # Java 11 JVM refuses any class file newer than major 55, so this is the
        # check that keeps the promise true rather than aspirational.
        run: |
          class=$(unzip -p target/acemq-java-rabbitmq-admin-*.jar \
                  org/acemq/rabbitmq/admin/RabbitAdmin.class | xxd -p -l 8 | cut -c13-16)
          echo "class file major version: 0x$class (expected 0037 = 55 = Java 11)"
          test "$class" = "0037"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7
